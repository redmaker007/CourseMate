project_id = "coursemate"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

# Only this adapter configuration changes when the SMTP provider changes.
# Request, verification, and member-binding code remains provider-neutral.
[auth.email.smtp]
enabled = true
host = "env(SUPABASE_AUTH_SMTP_HOST)"
port = 587
user = "env(SUPABASE_AUTH_SMTP_USER)"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "env(SUPABASE_AUTH_SMTP_ADMIN_EMAIL)"
sender_name = "env(SUPABASE_AUTH_SMTP_SENDER_NAME)"

[auth.email.template.magic_link]
subject = "CourseMate 登录验证码 / Sign-in code"
content_path = "./supabase/templates/email-otp.html"
